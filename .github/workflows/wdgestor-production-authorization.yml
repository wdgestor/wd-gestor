name: WD Gestor Production Authorization

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
      - migration/refactor-core
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-authorization:
    name: wdgestor-production-authorization
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Enforce ABN10 production authorization
        run: node scripts/security/check-r115ap239abn10-release-gate.cjs